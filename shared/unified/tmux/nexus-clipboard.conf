# Nexus tmux 3.5a: terminal selection is native; keep old copy-mode keys.
set -g mouse off
set -as terminal-features ',xterm*:clipboard,ghostty*:clipboard,tmux*:clipboard'
set -s user-keys[40] "\e[77101~"
set -g set-clipboard on
set -g display-time 2000

bind -T root User40 display-message -d 2000 'Drag over text first, then Cmd+C to copy'
bind -T root MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

bind -T copy-mode User40 send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi User40 send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode S-F1 send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi S-F1 send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode S-F2 send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi S-F2 send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode C-c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
