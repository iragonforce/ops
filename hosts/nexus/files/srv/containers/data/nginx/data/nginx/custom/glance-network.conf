geo $realip_remote_addr $homelab_access_mode {
  default external;
  192.168.1.0/24 local;
  192.168.2.0/24 local;
  192.168.3.0/24 local;
  192.168.4.0/24 local;
  192.168.5.0/24 local;
  127.0.0.1/32 local;
  100.64.0.0/10 tailscale;
  fd7a:115c:a1e0::/48 tailscale;
}

server {
  listen 172.16.11.4:18000;
  server_name _;
  location / {
    proxy_pass http://172.16.11.43:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Scheme https;
    proxy_set_header X-Homelab-Mode tailscale;
    proxy_redirect http://$http_host/ https://$http_host/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    client_max_body_size 0;
    proxy_buffering off;
  }
}

