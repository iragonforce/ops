document:
  head: "<style>\n  .services-monitor .monitor-site a {\n    align-items: flex-start;\n\
    \  }\n  .services-monitor .monitor-site-title {\n    white-space: pre-line;\n\
    \    line-height: 1.2;\n  }\n</style>\n\n<link rel=\"stylesheet\" href=\"/assets/glance-network.css?v=phase5\"\
    >\n<script defer src=\"/assets/glance-network.js?v=phase5\"></script>\n"
pages:
- name: Home
  columns:
  - size: full
    widgets:
    - type: html
      title: Services
      source: <div data-homelab-services="all" data-featured="true"></div>
- name: Gaming
  columns:
  - size: small
    widgets:
    - type: twitch-top-games
      limit: 20
      collapse-after: 13
      exclude:
      - just-chatting
      - pools-hot-tubs-and-beaches
      - music
      - art
      - asmr
  - size: full
    widgets:
    - type: group
      widgets:
      - type: reddit
        show-thumbnails: true
        subreddit: pcgaming
      - type: reddit
        subreddit: games
    - type: videos
      style: grid-cards
      collapse-after-rows: 3
      channels:
      - UCNvzD7Z-g64bPXxGzaQaa4g
      - UCZ7AeeVbyslLM_8-nVy2B8Q
      - UCHDxYLv8iovIbhrfl16CNyg
      - UC9PBzalIcEQCsiIkq36PyUA
  - size: small
    widgets:
    - type: reddit
      subreddit: gamingnews
      limit: 7
      style: vertical-cards
- name: Markets
  columns:
  - size: small
    widgets:
    - type: markets
      title: Indices
      markets:
      - symbol: SPY
        name: S&P 500
      - symbol: DX-Y.NYB
        name: Dollar Index
    - type: markets
      title: Crypto
      markets:
      - symbol: BTC-USD
        name: Bitcoin
      - symbol: ETH-USD
        name: Ethereum
    - type: markets
      title: Stocks
      sort-by: absolute-change
      markets:
      - symbol: NVDA
        name: NVIDIA
      - symbol: AAPL
        name: Apple
      - symbol: MSFT
        name: Microsoft
      - symbol: GOOGL
        name: Google
      - symbol: AMD
        name: AMD
      - symbol: RDDT
        name: Reddit
      - symbol: AMZN
        name: Amazon
      - symbol: TSLA
        name: Tesla
      - symbol: INTC
        name: Intel
      - symbol: META
        name: Meta
  - size: full
    widgets:
    - type: rss
      title: News
      style: horizontal-cards
      feeds:
      - url: https://feeds.bloomberg.com/markets/news.rss
        title: Bloomberg
      - url: https://moxie.foxbusiness.com/google-publisher/markets.xml
        title: Fox Business
      - url: https://moxie.foxbusiness.com/google-publisher/technology.xml
        title: Fox Business
    - type: group
      widgets:
      - type: reddit
        show-thumbnails: true
        subreddit: technology
      - type: reddit
        show-thumbnails: true
        subreddit: wallstreetbets
    - type: videos
      style: grid-cards
      collapse-after-rows: 3
      channels:
      - UCvSXMi2LebwJEM1s4bz5IBA
      - UCV6KDgJskWaEckne5aPA0aQ
      - UCAzhpt9DmG6PnHXjmJTvRGQ
  - size: small
    widgets:
    - type: rss
      title: News
      limit: 30
      collapse-after: 13
      feeds:
      - url: https://www.ft.com/technology?format=rss
        title: Financial Times
      - url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
        title: Wall Street Journal
