name: obsidian
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian@sha256:a3324c3380f40a70d98058636a47db4afaca261907751a720afa4132c7f4c14e
    container_name: obsidian
    restart: always
    shm_size: 1gb
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Etc/UTC
    env_file: /etc/nexus/secrets/obsidian-nexus/gui.env
    volumes:
    - /srv/containers/data/obsidian-nexus/config:/config
    - /home/iragonforce/secondBrain:/vault
    - /srv/containers/data/obsidian-nexus/vault-config:/vault/.obsidian
    networks:
      docker-vlan:
        ipv4_address: 192.168.5.57
        aliases:
          - obsidian-nexus
      paperclip-hermes:
        aliases:
        - obsidian-nexus
    mem_limit: 1610612736
    memswap_limit: 2147483648
    cpus: 2
    pids_limit: 1024
networks:
  docker-vlan:
    external: true
  paperclip-hermes:
    external: true
