name: n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a
    pull_policy: never
    container_name: n8n
    restart: always
    env_file:
    - path: /etc/nexus/secrets/n8n/n8n.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/n8n/data
      target: /home/node/.n8n
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 805306368
    cpus: 1.0
    networks:
      n8n_default:
        aliases:
        - n8n
        ipv4_address: 172.16.3.4
        mac_address: d6:e3:3b:f0:48:84
      docker-vlan:
        ipv4_address: 192.168.5.23
        gw_priority: 300
        mac_address: f2:4e:74:68:29:14
      proxy-backend:
        aliases:
        - n8n
        ipv4_address: 172.16.11.18
        mac_address: c6:c0:5c:7a:83:91
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - /usr/bin/wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:30109/healthz
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    dns:
    - 1.1.1.1
    memswap_limit: 1342177280
    pids_limit: 256
  n8n-postgres:
    image: postgres:18-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    pull_policy: never
    container_name: n8n-postgres
    restart: always
    env_file:
    - path: /etc/nexus/secrets/n8n/n8n-postgres.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/n8n/postgres
      target: /var/lib/postgresql
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.5
    networks:
      n8n_default:
        aliases:
        - n8n-postgres
        - postgres
        ipv4_address: 172.16.3.3
        mac_address: 3a:f3:d2:f1:72:da
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER:-postgres}"
      interval: 10s
      timeout: 5s
      retries: 10
    memswap_limit: 536870912
    pids_limit: 256
  n8n-redis:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    pull_policy: never
    container_name: n8n-redis
    restart: always
    env_file:
    - path: /etc/nexus/secrets/n8n/n8n-redis.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/n8n/redis
      target: /bitnami/redis/data
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    networks:
      n8n_default:
        aliases:
        - n8n-redis
        - redis
        ipv4_address: 172.16.3.2
        mac_address: aa:9e:3c:48:60:22
    memswap_limit: 536870912
    pids_limit: 256
networks:
  n8n_default:
    external: true
  docker-vlan:
    external: true
  proxy-backend:
    external: true
  nexus-egress:
    external: true
