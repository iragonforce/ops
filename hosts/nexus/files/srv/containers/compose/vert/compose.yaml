name: vert
services:
  vert:
    image: ghcr.io/vert-sh/vert@sha256:c604d357e44dce6020391b6bd8d20e4f5d35e3778ecf58bbccbd8fdc6792eaf4
    pull_policy: never
    container_name: vert
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent --output /dev/null http://localhost || exit 1
      interval: 30000000000ns
      timeout: 10000000000ns
      start_period: 5000000000ns
      retries: 3
    env_file:
    - path: /etc/nexus/secrets/vert/vert.env
      format: raw
    volumes: []
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    networks:
      docker-vlan:
        ipv4_address: 192.168.5.3
        gw_priority: 300
        mac_address: ce:6b:bf:60:5b:dc
      proxy-backend:
        aliases:
        - vert
        ipv4_address: 172.16.11.26
        mac_address: 86:3b:47:3a:93:16
    dns:
    - 1.1.1.1
    memswap_limit: 536870912
    pids_limit: 256
networks:
  docker-vlan:
    external: true
  proxy-backend:
    external: true
  nexus-egress:
    external: true
