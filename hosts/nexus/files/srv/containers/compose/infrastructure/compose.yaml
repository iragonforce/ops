services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    pull_policy: never
    container_name: nginx-proxy-manager
    restart: always
    env_file:
    - path: /etc/nexus/secrets/infrastructure/nginx-proxy-manager.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/nginx/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/nginx/certificates
      target: /etc/letsencrypt
      read_only: false
      bind:
        create_host_path: false
    cap_add:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_FOWNER
    - CAP_SETGID
    - CAP_SETUID
    shm_size: 67108864
    mem_limit: 1073741824
    cpus: 0.5
    networks:
      docker-vlan:
        ipv4_address: 192.168.5.20
        gw_priority: 100
        mac_address: 32:b6:85:33:8a:af
      proxy-backend:
        aliases:
        - nginx-proxy-manager
        ipv4_address: 172.16.11.4
        mac_address: ae:cf:88:f0:75:c7
      nexus-egress:
        gw_priority: 200
        ipv4_address: 172.30.240.251
        mac_address: f2:08:ef:12:03:b7
    ports:
    - 192.168.1.2:80:80/tcp
    - 192.168.1.2:443:443/tcp
    - 100.96.255.81:80:80/tcp
    - 100.96.255.81:443:443/tcp
    dns:
    - 1.1.1.1
    memswap_limit: 1610612736
    pids_limit: 256
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    pull_policy: never
    container_name: cloudflared
    restart: always
    command:
    - tunnel
    - --no-autoupdate
    - run
    env_file:
    - path: /etc/nexus/secrets/infrastructure/cloudflared.env
      format: raw
    volumes: []
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    networks:
      docker-vlan:
        ipv4_address: 192.168.5.22
        gw_priority: 300
        mac_address: 7a:3a:f7:e3:9a:05
      proxy-backend:
        aliases:
        - cloudflared
        ipv4_address: 172.16.11.3
        mac_address: 82:b2:89:87:c2:96
      nexus-egress:
        gw_priority: 200
        ipv4_address: 172.30.240.250
        mac_address: 16:fb:75:d7:c4:af
    dns:
    - 1.1.1.1
    memswap_limit: 536870912
    pids_limit: 256
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    pull_policy: never
    container_name: authentik-worker
    restart: unless-stopped
    command:
    - worker
    healthcheck:
      test:
      - CMD
      - ak
      - healthcheck
      interval: 30000000000ns
      timeout: 30000000000ns
      start_period: 60000000000ns
      retries: 3
    env_file:
    - path: /etc/nexus/secrets/infrastructure/authentik-worker.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/authentik/certs
      target: /certs
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/authentik/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/authentik/templates
      target: /templates
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 1073741824
    cpus: 1.0
    networks:
      authentik_default:
        aliases:
        - authentik-worker
        ipv4_address: 172.16.1.5
        mac_address: 92:29:c9:39:0d:cc
    depends_on:
      authentik-postgres:
        condition: service_healthy
  adguard-home:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    pull_policy: never
    container_name: adguard-home
    restart: unless-stopped
    command:
    - --no-check-update
    - --web-addr
    - 0.0.0.0:30004
    - --config
    - /opt/adguardhome/conf/AdGuardHome.yaml
    - --work-dir
    - /opt/adguardhome/work
    env_file:
    - path: /etc/nexus/secrets/infrastructure/adguard-home.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/adguard/home
      target: /opt/adguardhome/conf
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/adguard/workdir
      target: /opt/adguardhome/work
      read_only: false
      bind:
        create_host_path: false
    cap_add:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_FOWNER
    - CAP_NET_BIND_SERVICE
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.5
    networks:
      adguard-vlan:
        ipv4_address: 192.168.3.2
        gw_priority: 100
        ipv6_address: fd00:3::2
        mac_address: ca:c5:50:dd:ac:cd
      proxy-backend:
        aliases:
        - adguard-home
        ipv4_address: 172.16.11.17
        mac_address: 2e:ac:0b:18:9d:05
      nexus-egress:
        gw_priority: 200
        ipv4_address: 172.30.240.240
        mac_address: aa:4a:73:f5:61:f7
    healthcheck:
      test:
      - CMD
      - /usr/bin/wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:30004/
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    ports:
    - 192.168.1.2:1054:53/tcp
    - 192.168.1.2:1054:53/udp
    - 100.96.255.81:1054:53/tcp
    - 100.96.255.81:1054:53/udp
    dns:
    - 1.1.1.1
    - 8.8.8.8
  authentik-postgres:
    image: postgres:18-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    pull_policy: never
    container_name: authentik-postgres
    restart: always
    env_file:
    - path: /etc/nexus/secrets/infrastructure/authentik-postgres.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/authentik/postgres
      target: /var/lib/postgresql
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/authentik/postgres
      target: /var/lib/postgresql/data
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 536870912
    cpus: 0.75
    networks:
      authentik_default:
        aliases:
        - postgres
        - authentik-postgres
        ipv4_address: 172.16.1.3
        mac_address: 7e:6a:9e:fa:8d:94
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER:-postgres}"
      interval: 10s
      timeout: 5s
      retries: 10
    memswap_limit: 1073741824
    pids_limit: 256
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    pull_policy: never
    container_name: authentik-server
    restart: unless-stopped
    command:
    - server
    healthcheck:
      test:
      - CMD
      - ak
      - healthcheck
      interval: 30000000000ns
      timeout: 30000000000ns
      start_period: 60000000000ns
      retries: 3
    env_file:
    - path: /etc/nexus/secrets/infrastructure/authentik-server.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/authentik/certs
      target: /certs
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/authentik/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/authentik/templates
      target: /templates
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 1073741824
    cpus: 1.0
    networks:
      authentik_default:
        aliases:
        - authentik-server
        ipv4_address: 172.16.1.4
        mac_address: 6a:43:51:46:70:4a
      docker-vlan:
        ipv4_address: 192.168.5.21
        gw_priority: 300
        mac_address: aa:8b:55:3c:07:76
      proxy-backend:
        aliases:
        - authentik-server
        ipv4_address: 172.16.11.20
        mac_address: 7a:51:d5:c1:44:9d
    depends_on:
      authentik-postgres:
        condition: service_healthy
    dns:
    - 1.1.1.1
  authentik-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull_policy: never
    container_name: authentik-redis
    restart: always
    env_file:
    - path: /etc/nexus/secrets/infrastructure/authentik-redis.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/authentik-redis/recovered-volumes/7c6114478bd1a84ea624ba12a7a2e13d691ccf41912fa81df11f14a3c49a5676
      target: /data
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    networks:
      authentik_default:
        aliases:
        - redis
        - authentik-redis
        ipv4_address: 172.16.1.2
        mac_address: 5e:fc:67:a6:24:51
    memswap_limit: 536870912
    pids_limit: 256
networks:
  docker-vlan:
    external: true
  proxy-backend:
    external: true
  nexus-egress:
    external: true
  authentik_default:
    external: true
  adguard-vlan:
    external: true
