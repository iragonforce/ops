name: webhook-notify
services:
  webhook-notify:
    image: nexus/webhook-notify:20261011@sha256:27f84cbbd9964184c8f9bf0eea4ceb55faf6285876bb28fd4acd4efa7d05072f
    pull_policy: never
    container_name: webhook-notify
    restart: always
    env_file:
    - path: /etc/nexus/secrets/webhook-notify/webhook-notify.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/webhook-notify/webhook-notify.py
      target: /app/webhook-notify.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/nexus/secrets/webhook-notify/ssh_key
      target: /root/.ssh/id_ed25519_datacrafter
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/webhook-notify/known_hosts
      target: /root/.ssh/known_hosts
      read_only: true
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    networks:
      docker-vlan:
        ipv4_address: 192.168.5.24
        gw_priority: 300
        mac_address: 3e:6c:4b:9a:a3:5a
      proxy-backend:
        aliases:
        - webhook-notify
        ipv4_address: 172.16.11.21
        mac_address: 6a:9f:31:a4:17:c0
    dns:
    - 1.1.1.1
    memswap_limit: 536870912
    pids_limit: 256
networks:
  docker-vlan:
    external: true
  proxy-backend:
    external: true
  nexus-egress:
    external: true
