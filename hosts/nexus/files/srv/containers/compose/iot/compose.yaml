services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
    pull_policy: never
    container_name: home-assistant
    restart: always
    env_file:
    - path: /etc/nexus/secrets/iot/home-assistant.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/home-assistant/config
      target: /config
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 1073741824
    cpus: 1.5
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '0'
    networks:
      home-assistant_default:
        aliases:
        - home-assistant
        ipv4_address: 172.16.13.3
        mac_address: a2:e5:a6:16:33:ae
      iot-vlan:
        ipv4_address: 192.168.4.22
        gw_priority: 300
        interface_name: iot0
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.disable_ipv6=0,net.ipv6.conf.IFNAME.accept_ra=2
        ipv6_address: fd00:4::22
        mac_address: 9e:42:94:8e:b8:9b
      proxy-backend:
        aliases:
        - home-assistant
        ipv4_address: 172.16.11.19
        mac_address: 5e:66:d2:e6:92:8b
    depends_on:
      home-assistant-postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - -fsS
      - --max-time
      - '4'
      - http://127.0.0.1:30103/
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    dns:
    - 1.1.1.1
    devices: []
    memswap_limit: 1610612736
    pids_limit: 256
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
    pull_policy: never
    container_name: zigbee2mqtt
    restart: always
    env_file:
    - path: /etc/nexus/secrets/iot/zigbee2mqtt.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/zigbee2mqtt/data
      target: /app/data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /dev/serial/by-id
      target: /dev/serial/by-id
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/udev
      target: /run/udev
      read_only: true
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.5
    devices:
    - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_f01520bc73c2ef11823cc0138148b910-if00-port0:/dev/zigbee:rwm
    networks:
      iot-vlan:
        ipv4_address: 192.168.4.5
        gw_priority: 300
        ipv6_address: fd00:4::5
        interface_name: iot0
        mac_address: 96:c2:4c:63:b4:17
      proxy-backend:
        aliases:
        - zigbee2mqtt
        ipv4_address: 172.16.11.240
        mac_address: 12:88:1d:96:35:9c
    healthcheck:
      test:
      - CMD
      - /usr/bin/wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    dns:
    - 1.1.1.1
    memswap_limit: 536870912
    pids_limit: 256
  home-assistant-postgres:
    image: postgres:18-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    pull_policy: never
    container_name: home-assistant-postgres
    restart: always
    env_file:
    - path: /etc/nexus/secrets/iot/home-assistant-postgres.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/home-assistant/postgres
      target: /var/lib/postgresql
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.5
    networks:
      home-assistant_default:
        aliases:
        - postgres
        - home-assistant-postgres
        ipv4_address: 172.16.13.2
        mac_address: f6:50:ac:45:e2:a2
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER:-postgres}"
      interval: 10s
      timeout: 5s
      retries: 10
    memswap_limit: 536870912
    pids_limit: 256
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    pull_policy: never
    container_name: matter-server
    restart: always
    env_file:
    - path: /etc/nexus/secrets/iot/matter-server.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/matter-server
      target: /data
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 536870912
    cpus: 0.5
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '0'
    networks:
      iot-vlan:
        ipv4_address: 192.168.4.8
        gw_priority: 300
        interface_name: iot0
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.disable_ipv6=0,net.ipv6.conf.IFNAME.accept_ra=2
        ipv6_address: fd00:4::8
        mac_address: e6:bc:2a:2e:0a:5e
      proxy-backend:
        aliases:
        - matter-server
        ipv4_address: 172.16.11.15
        mac_address: be:e2:bc:bd:cd:62
    command:
    - --storage-path
    - /data
    - --paa-root-cert-dir
    - /data/credentials
    - --primary-interface
    - iot0
    dns:
    - 1.1.1.1
    memswap_limit: 1073741824
    pids_limit: 256
  mosquitto:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    pull_policy: never
    container_name: mosquitto
    restart: always
    env_file:
    - path: /etc/nexus/secrets/iot/mosquitto.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/mosquitto/config/mosquitto.conf
      target: /mosquitto/config/mosquitto.conf
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/mosquitto/data
      target: /mosquitto/data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/mosquitto/log
      target: /mosquitto/log
      read_only: false
      bind:
        create_host_path: false
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    networks:
      iot-vlan:
        ipv4_address: 192.168.4.4
        gw_priority: 300
        ipv6_address: fd00:4::4
        interface_name: iot0
        mac_address: 36:14:48:8d:dc:f8
      proxy-backend:
        aliases:
        - mosquitto
        ipv4_address: 172.16.11.5
        mac_address: 9e:a7:48:e3:eb:e2
    dns:
    - 1.1.1.1
    memswap_limit: 536870912
    pids_limit: 256
  otbr:
    image: openthread/otbr@sha256:dafdb152e9b0dae68b9da66deaf893e00643e9df340455f2d8f35259bd869efc
    pull_policy: never
    container_name: otbr
    restart: always
    entrypoint:
    - /bin/bash
    - /usr/local/bin/otbr-start.sh
    env_file:
    - path: /etc/nexus/secrets/iot/otbr.env
      format: raw
    volumes:
    - type: bind
      source: /srv/containers/data/iot-mqtt/otbr-start.sh
      target: /usr/local/bin/otbr-start.sh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/nexus/secrets/iot/thread-dataset.env
      target: /usr/local/etc/thread-dataset.env
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /etc/nexus/secrets/iot/thread-dataset.hex
      target: /usr/local/etc/thread-dataset.hex
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/containers/data/iot-mqtt/otbr-settings
      target: /var/lib/thread
      read_only: false
      bind:
        create_host_path: false
    privileged: true
    security_opt:
    - label=disable
    shm_size: 67108864
    mem_limit: 268435456
    cpus: 0.25
    devices:
    - /dev/serial/by-id/usb-Nordic_Semiconductor_ASA_Thread_Co-Processor_7A4E9B7CEA8691CC-if00:/dev/ttyACM0:rwm
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '0'
    networks:
      iot-vlan:
        ipv4_address: 192.168.4.7
        gw_priority: 300
        interface_name: iot0
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.disable_ipv6=0,net.ipv6.conf.IFNAME.accept_ra=2
        ipv6_address: fd00:4::7
        mac_address: 06:5d:c8:a5:72:43
      proxy-backend:
        aliases:
        - otbr
        ipv4_address: 172.16.11.13
        mac_address: 3e:d0:f8:ca:2c:02
    dns:
    - 1.1.1.1
    memswap_limit: 536870912
    pids_limit: 256
networks:
  home-assistant_default:
    external: true
  iot-vlan:
    external: true
  proxy-backend:
    external: true
  nexus-egress:
    external: true
