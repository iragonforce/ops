services:
  api:
    image: python:3.12-alpine
    container_name: stepca-summary
    user: 10001:10001
    read_only: true
    restart: always
    command:
    - python
    - -B
    - /app/server.py
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    volumes:
    - type: bind
      source: /opt/homelab-api/adapters/stepca-summary/server.py
      target: /app/server.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/homelab-api/data/stepca
      target: /run/stepca-data
      read_only: true
      bind:
        create_host_path: false
    networks:
      proxy-backend:
        ipv4_address: 172.16.11.100
        aliases:
        - homelab-stepca-summary
    healthcheck:
      test:
      - CMD
      - python
      - -B
      - -c
      - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 268435456
    memswap_limit: 536870912
    cpus: 0.5
    pids_limit: 256
networks:
  proxy-backend:
    external: true
name: stepca-summary
