name: wealthfolio

services:
  wealthfolio:
    image: wealthfolio/wealthfolio:3.12.0
    container_name: wealthfolio
    restart: unless-stopped

    ports:
      - "127.0.0.1:18088:8088"

    env_file:
      - /opt/wealthfolio/.env

    environment:
      WF_LISTEN_ADDR: "0.0.0.0:8088"
      WF_DB_PATH: "/data/wealthfolio.db"
      WF_DB_REQUIRE_ENCRYPTION: "true"

    volumes:
      - wealthfolio-data:/data

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8088/api/v1/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=64M

volumes:
  wealthfolio-data:
    name: wealthfolio-data
