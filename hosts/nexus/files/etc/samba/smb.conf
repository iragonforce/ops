[global]
 workgroup = WORKGROUP
 server string = Nexus storage
 server role = standalone server
 security = user
 server min protocol = SMB2_02
 server max protocol = SMB3
 interfaces = lo enp6s0 tailscale0
 bind interfaces only = yes
 hosts allow = 127.0.0.1 192.168.1.3 192.168.1.4 192.168.1.5 192.168.1.102 192.168.1.6 100.103.67.56 100.114.178.50
 hosts deny = ALL
 log file = /var/log/samba/log.%m
 max log size = 10240
 logging = file
 log level = 1 auth_audit:3
 load printers = no
 disable spoolss = yes
 printing = bsd
 printcap name = /dev/null
 vfs objects = fruit streams_xattr
 fruit:metadata = stream
 fruit:resource = stream
 ea support = yes
 store dos attributes = yes

    map to guest = Bad User
[T7]
    comment = Samsung T7 external SSD
    path = /mnt/t7
    browseable = yes
    read only = no
    force user = iragonforce
    force group = iragonforce
    create mask = 0660
    directory mask = 0770
    root preexec = /usr/bin/mountpoint -q /mnt/t7
    root preexec close = yes

    guest ok = yes
    guest only = no
[fast]
    path = /mnt/fast
    browseable = yes
    read only = no
    force user = iragonforce
    force group = iragonforce
    root preexec = /usr/bin/mountpoint -q /mnt/fast
    root preexec close = yes
    wide links = no

    guest ok = yes
    guest only = no
[bulk]
    path = /mnt/bulk
    browseable = yes
    read only = no
    force user = iragonforce
    force group = iragonforce
    root preexec = /usr/bin/mountpoint -q /mnt/bulk
    root preexec close = yes
    wide links = no
    guest ok = yes
    guest only = no
