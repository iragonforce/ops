# Keep pane, status-line, and application mouse actions without entering copy mode.
set -g mouse on
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind -T root MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b true'
bind -T root WheelUpPane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b true'
bind -T root WheelDownPane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b true'
unbind -q -T root MouseDrag1ScrollbarSlider

# Ghostty's own scrollback is available when mouse reporting is toggled off.
# Keep the tmux client on Ghostty's primary screen for that scrollback.
set -ga terminal-overrides ',xterm-ghostty:smcup@:rmcup@'
