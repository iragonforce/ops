# Keep the messaging gateway available while GPU model admission is unavailable.
# The pinned fail-closed Hermes middleware denies local llama requests before
# provider execution unless an outermost trusted lease policy is registered.
# Do not add a dependency on the failed llama service or a /health prestart:
# probing /health and restarting the model outside admission can wake the GPU.
[Unit]
After=network-online.target
