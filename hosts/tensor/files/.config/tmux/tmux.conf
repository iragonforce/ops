#### Generated baseline from ~/tmux-g.md

# Shell and terminal behavior
set-option -g default-shell /bin/zsh
set-option -g default-command ''
set-option -g default-terminal 'tmux-256color'
set-option -sa terminal-features ',xterm*:RGB,ghostty*:RGB,tmux*:RGB'
set-option -sa terminal-overrides ',*:Tc'
set-option -g default-size 80x24
set-option -g history-limit 10000000
set-option -g destroy-unattached off
set-option -g detach-on-destroy off
set-option -g renumber-windows off

# Input
set-option -g prefix C-b
set-option -g prefix2 None
set-option -g status-keys vi
# Mouse capture is enabled for pane and application clicks.
set -g mode-keys vi
set-option -g window-style 'fg=default,bg=default'
set-option -g window-active-style 'fg=default,bg=default'
set-option -g repeat-time 500
set-option -gq initial-repeat-time 0

# Messages and panes
set-option -g display-panes-active-colour red
set-option -g display-panes-colour blue
set-option -g display-panes-time 1000
set-option -g display-time 750
set-option -g message-style 'bg=yellow,fg=black,fill=yellow'
set-option -g message-command-style 'bg=black,fg=yellow,fill=black'

# Status bar
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 1
set-option -g status-justify left
set-option -g status-left '[#{host_short}] '
set-option -g status-left-length 12
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} %H:%M:%S %d-%b-%y'
set-option -g status-right-length 40
set-option -g status-style 'bg=default,fg=#ffff00'
set-window-option -g window-status-style 'fg=#ffffff,bg=default'
set-window-option -g window-status-current-style 'fg=#ffff00,bg=default,bold'
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format ' #I:#W '

# Window titles
set-option -g set-titles off
set-option -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}'
set -g base-index 1
setw -g pane-base-index 1

# Alerts
set-option -g bell-action any
set-option -g silence-action other
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off

# Copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane
set -g set-clipboard on

# Shared status behaviour.

# Copy selected text to the macOS clipboard with c in copy mode.
bind-key -T copy-mode-vi c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy "#{session_name}"'
bind-key -T copy-mode c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy "#{session_name}"'
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy "#{session_name}"'
bind-key -T copy-mode C-c send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tmux-copy copy "#{session_name}"'
set -g @tmux-copy-enabled on
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard,ghostty*:clipboard,tmux*:clipboard'

set -s user-keys[40] "\033[77101~"
set -s user-keys[41] "\033[77102~"
bind -T root User40 display-message -d 5000 'Drag over text first, then Cmd/Super+C to copy'
bind -T root User41 run-shell -b '$HOME/.local/bin/tmux-copy paste #{q:session_name} #{pane_id}'
bind ] run-shell -b '$HOME/.local/bin/tmux-copy paste #{q:session_name} #{pane_id}'

bind -T root MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode User40 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi User40 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode S-F1 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi S-F1 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode S-F2 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi S-F2 send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode c send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode y send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel -C -P '$HOME/.local/bin/tmux-copy copy #{q:session_name}'
bind -T copy-mode C-c send-keys -X cancel
bind -T copy-mode-vi C-c send-keys -X cancel
bind -T copy-mode User41 send-keys -X cancel \; run-shell -b '$HOME/.local/bin/tmux-copy paste #{q:session_name} #{pane_id}'
bind -T copy-mode-vi User41 send-keys -X cancel \; run-shell -b '$HOME/.local/bin/tmux-copy paste #{q:session_name} #{pane_id}'

set -g mouse on

# Legacy wheel bindings are superseded by mouse-interaction.conf below.
bind -T copy-mode    WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

bind -n MouseDown1Pane select-pane -t= \; send-keys -M

bind -n MouseDrag1Pane if-shell -F \
    "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send-keys -M" \
    "copy-mode -M"

set -g mouse on

bind -n WheelUpPane if-shell -F -t = \
    "#{||:#{mouse_any_flag},#{pane_in_mode}}" \
    "send-keys -M" \
    "copy-mode -e"

# Keep mouse actions out of tmux copy mode.
source-file ~/.config/tmux/mouse-interaction.conf

# Unified SSH selector (window 0, native tmux menu)
source-file "/home/iragonforce/.config/tmux/ssh-menu.conf"
