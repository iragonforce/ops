# Keep the host available over SSH. Manual locking is unchanged.
general {
    lock_cmd = pidof hyprlock || /home/iragonforce/.config/hypr/scripts/lock-manual.sh
    before_sleep_cmd = /home/iragonforce/.local/bin/hibernate
    after_sleep_cmd = /home/iragonforce/.local/bin/hibernate resume
}

listener {
    timeout = 1800
    on-timeout = /home/iragonforce/.local/bin/hibernate
    on-resume = /home/iragonforce/.local/bin/hibernate resume
    ignore_inhibit = true
}

# This also arms input resume for manually requested visual standby.
# The wrapper exits immediately when no standby marker exists.
listener {
    timeout = 1
    on-resume = /home/iragonforce/.local/bin/hibernate resume
    ignore_inhibit = true
}
